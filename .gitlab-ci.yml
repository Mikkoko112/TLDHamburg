stages:
  - backend

before_script:
  - apk add python3 py3-pip make
  - pip install --upgrade pip
  - python -m venv venv
  - source venv/bin/activate
  - pip install .

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

unit-test-job:
  stage: backend
  cache:
    paths:
      - .cache/pip 
  script:
    - python test/test_things.py
    - echo "Congratulations test_things.py passed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'