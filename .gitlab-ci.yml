stages:
  - backend

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"  

before_script:
  - apk add --no-cache python3 py3-pip make gcc musl-dev geos-dev python3-dev
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip setuptools wheel
  - export SHAPELY_USE_CUSTOM_GEOS=0 
  - pip install .

unit-test-job:
  stage: backend
  image: alpine:latest
  cache:
    paths:
      - .cache/pip 
  script:
    - source venv/bin/activate
    - python test/test_things.py
    - echo "Congratulations test_things.py passed."
    - python test/test_data_fetcher_mock_api.py
    - echo "Congratulations test_data_fetcher_mock_api.py passed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

API_availability_job:
  stage: backend
  image: alpine:latest
  cache:
    paths:
      - .cache/pip 
  script:
    - source venv/bin/activate
    - python test/test_data_fetcher_real_api.py
    - echo "Congratulations test_data_fetcher_real_api.py passed."
  allow_failure : true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'