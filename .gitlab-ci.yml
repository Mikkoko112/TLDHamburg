stages:
  - backend
  - frontend

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"  

before_script:
  - apt-get update && apt-get install -y build-essential libgeos-dev
  # - apk add --no-cache python3 py3-pip make gcc musl-dev geos-dev python3-dev
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip setuptools wheel
  - export SHAPELY_USE_CUSTOM_GEOS=0 
  - pip install .

unit-test-bakcend-job:
  stage: backend
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip 
  script:
    - source venv/bin/activate
    - python test/test_things.py
    - echo "Congratulations test_things.py passed."
    - python test/test_data_fetcher_mock_api.py
    - echo "Congratulations test_data_fetcher_mock_api.py passed."
    - python test/test_trafficlightapprox.py
    - echo "Congratulations test_trafficlightapprox.py passed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  
unit-test-frontend-job:
  stage: frontend
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip 
  script:
    - source venv/bin/activate
    - python test/test_geocoding_utils.py
    - echo "Congratulations test_geocoding_utils.py passed."
#    - python test/test_get_objects.py
#    - echo "Congratulations test_get_objects.py passed."  
#    - python test/test_trafficlights.py
#    - echo "Congratulations test_trafficlights.py passed." 
    #- python test/test_navigation.py
    #- echo "Congratulations test_navigation.py passed."
#    - python test/test_position.py
#    - echo "Congratulations test_position.py passed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

API_availability_backend-job:
  stage: backend
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip 
  script:
    - source venv/bin/activate
    - python test/test_data_fetcher_real_api.py
    - echo "Congratulations test_data_fetcher_real_api.py passed."
  allow_failure : true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

API_availability_frontend-job:
  stage: frontend
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip 
  script:
    - source venv/bin/activate
    - python test/test_geocoding_utils_api.py
    - echo "Congratulations test_geocoding_utils_api.py passed."
  allow_failure : true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'