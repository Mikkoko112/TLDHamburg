[build-system]
requires = [
    "hatchling",
    "setuptools>=61.0",
    "wheel"
]
build-backend = "hatchling.build"

[project]
name = "tldhamburg"
version = "0.1.0"
authors = [
    { name = "Max Mustermann" },
]
description = "TLD Hamburg project."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "concurrent"
    "requests",
    "flask",
    "dash",
    "dash_leaflet",
    "dash_bootstrap_components",
    "dash_core_components",
    "dash_html_components",
    "geopy",
    "loguru",
    "pathlib"
]
