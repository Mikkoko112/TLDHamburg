[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tldhamburg"
version = "0.1.0"
authors = [
    { name = "Max Mustermann" },
]
description = "TLD Hamburg project."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "requests",
    "shapely",
    "flask>=3.0.3",
    "dash>=2.18.1",
    "dash_leaflet>=1.0.15",
    "dash_bootstrap_components>=1.6.0",
    "dash_core_components>=2.0.0",
    "dash_html_components>=2.0.0",
    "geopy>=2.4.1",
    "loguru>=0.7.2",
    "requests>=2.32.3",
    "pathlib"
]
